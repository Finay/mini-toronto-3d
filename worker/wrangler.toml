# Configuration for the TTC feed proxy. Deploy with `npm run worker:deploy`.
name = "mini-toronto-ttc"
main = "index.ts"
compatibility_date = "2026-10-01"

[vars]
# Which site may read the Worker's responses: the static site on GitHub
# Pages. An origin is scheme and host only, with no path or trailing slash.
# Use "*" to let any site (or a local preview) use it.
ALLOWED_ORIGIN = "https://finay.github.io"
